name: 测试与打包

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Windows 自动化测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt pytest
      - name: 运行全部测试
        run: pytest tests -v

  build:
    name: 打包 Windows exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖与打包器
        run: pip install -r requirements.txt pyinstaller
      - name: PyInstaller 打包
        run: pyinstaller --noconfirm --onefile --windowed --name WatermarkCleaner app/main.py
      - name: 自动发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建版
          body: 每次代码更新后自动构建。测试全部通过才会出现在这里。
          files: dist/WatermarkCleaner.exe
          prerelease: true
